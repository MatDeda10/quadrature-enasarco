<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analisi Quadrature Enasarco</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-gray-900">Quadrature Enasarco</h1>
            <p class="text-gray-600">Carica l'estratto conto per verificare i saldi e le rilevazioni.</p>
        </header>

        <!-- Upload Section -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 mb-8">
            <div class="flex items-center justify-center w-full">
                <label class="flex flex-col items-center justify-center w-full h-32 border-2 border-dashed border-gray-300 rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100">
                    <div class="flex flex-col items-center justify-center pt-5 pb-6">
                        <svg class="w-8 h-8 mb-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                        <p class="mb-2 text-sm text-gray-500 font-semibold">Clicca per caricare il file dell'estratto conto</p>
                        <p class="text-xs text-gray-400">CSV o TXT (formato export contabile)</p>
                    </div>
                    <input id="fileInput" type="file" class="hidden" accept=".csv,.txt" />
                </label>
            </div>
        </div>

        <!-- Dashboard Stats -->
        <div id="statsContainer" class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8 hidden">
            <div class="bg-white p-6 rounded-lg border border-gray-200 shadow-sm">
                <p class="text-sm font-medium text-gray-500 uppercase">Totale Rilevazioni (Avere)</p>
                <p id="totalAvere" class="text-2xl font-bold text-blue-600">EUR 0,00</p>
            </div>
            <div class="bg-white p-6 rounded-lg border border-gray-200 shadow-sm">
                <p class="text-sm font-medium text-gray-500 uppercase">Totale Versamenti (Dare)</p>
                <p id="totalDare" class="text-2xl font-bold text-green-600">EUR 0,00</p>
            </div>
            <div id="balanceCard" class="bg-white p-6 rounded-lg border border-gray-200 shadow-sm">
                <p class="text-sm font-medium text-gray-500 uppercase">Saldo Residuo Enasarco</p>
                <p id="netBalance" class="text-2xl font-bold text-gray-900">EUR 0,00</p>
            </div>
        </div>

        <!-- Table View -->
        <div id="tableContainer" class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left text-gray-500">
                    <thead class="text-xs text-gray-700 uppercase bg-gray-100">
                        <tr>
                            <th class="px-6 py-3">Data Reg.</th>
                            <th class="px-6 py-3">Descrizione</th>
                            <th class="px-6 py-3 text-right">Dare</th>
                            <th class="px-6 py-3 text-right">Avere</th>
                            <th class="px-6 py-3 text-right">Saldo Progr.</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            Papa.parse(file, {
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    processEnasarcoData(results.data);
                }
            });
        });

        function parseCurrency(value) {
            if (!value) return 0;
            // Rimuove virgolette e gestisce il formato numerico (es. "23,255.12" -> 23255.12)
            let cleanValue = value.replace(/"/g, '').replace(/,/g, '');
            return parseFloat(cleanValue) || 0;
        }

        function formatCurrency(value) {
            return 'EUR ' + Math.abs(value).toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function processEnasarcoData(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            let sumDare = 0;
            let sumAvere = 0;

            data.forEach(row => {
                const desc = row['Descrizione Contabile'] || '';
                const dare = parseCurrency(row['Dare']);
                const avere = parseCurrency(row['Avere']);
                const dataReg = row['Data\nRegistraz.'] || row['Data Registraz.'] || '';

                // Filtriamo solo le righe rilevanti per Enasarco o Versamenti
                if (desc.toLowerCase().includes('enasarco') || desc.toLowerCase().includes('versam') || desc.toLowerCase().includes('addebito')) {
                    sumDare += dare;
                    sumAvere += avere;

                    const tr = document.createElement('tr');
                    tr.className = 'border-b hover:bg-gray-50 transition-colors';
                    tr.innerHTML = `
                        <td class="px-6 py-4 font-medium text-gray-900">${dataReg}</td>
                        <td class="px-6 py-4">${desc}</td>
                        <td class="px-6 py-4 text-right text-green-600">${dare > 0 ? formatCurrency(dare) : '-'}</td>
                        <td class="px-6 py-4 text-right text-blue-600">${avere > 0 ? formatCurrency(avere) : '-'}</td>
                        <td class="px-6 py-4 text-right font-mono">${row['Saldo\nProgressivo'] || row['Saldo Progressivo']}</td>
                    `;
                    tbody.appendChild(tr);
                }
            });

            // Update UI
            document.getElementById('statsContainer').classList.remove('hidden');
            document.getElementById('tableContainer').classList.remove('hidden');
            
            document.getElementById('totalAvere').textContent = formatCurrency(sumAvere);
            document.getElementById('totalDare').textContent = formatCurrency(sumDare);
            
            const net = sumAvere - sumDare;
            const netElement = document.getElementById('netBalance');
            netElement.textContent = formatCurrency(net);
            
            const balanceCard = document.getElementById('balanceCard');
            if (Math.abs(net) < 0.01) {
                balanceCard.classList.add('bg-green-50');
                netElement.className = 'text-2xl font-bold text-green-700';
            } else {
                balanceCard.classList.remove('bg-green-50');
                netElement.className = 'text-2xl font-bold text-red-600';
            }
        }
    </script>
</body>
</html>
